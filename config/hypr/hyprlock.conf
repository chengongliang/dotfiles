# ============================================================
#  hyprlock — Windows 11 锁屏（待机态）
#
#  目标：只显示「清晰壁纸 + 顶部大时钟 + 下方加粗日期」，
#        头像和密码框默认不出现，一按键才浮现 —— 与 Win11 一致。
#
#  ── 坐标约定 ────────────────────────────────────────────────
#  hyprlock 的 Y 轴 **向上为正**：
#    valign = top    → y 为负 = 从顶边往下走（Win11 就是固定顶边距）
#    valign = center → y 为正 = 往上
#
#  ── 单位约定（重要）────────────────────────────────────────
#  hyprlock 的 font_size 是 **磅(pt)**，不是像素。
#  hyprgraphics 走 pango_font_description_set_size()，96 DPI，
#  即实际渲染像素 = font_size × 4/3。改字号时务必按 pt 算。
#
#  ── 版面来源 ────────────────────────────────────────────────
#  时钟/日期的字号与位置是按 Win11 截图反解出来的（降采样到参考图
#  尺度后比对墨迹包围盒）：时钟墨迹 78x29、日期墨迹 81x10、
#  时钟中心距顶 19.1%、日期中心距顶 32.6%。
#  这里用「固定 effective px」而非按屏高缩放，与 Windows 的行为一致，
#  因此 eDP-1(1280x800 逻辑) 和 DP-3(1920x1080 逻辑) 共用同一套数值。
#
#  ── 壁纸 ────────────────────────────────────────────────────
#  下面 background 里的 path 那行末尾带同步标记，锁屏时由
#  scripts/lock.sh 替换成 noctalia 当前实际在用的壁纸。
#  请勿删除该标记；手动指定壁纸就把标记去掉。
# ============================================================

general {
    hide_cursor = true
    ignore_empty_input = false
}

# ── 背景：系统当前壁纸，**不做任何模糊/调色** ────────────────
#    Win11 待机锁屏就是原图；模糊只发生在点进登录页之后。
background {
    monitor =
    path = /etc/xdg/quickshell/noctalia-shell/Assets/Wallpaper/noctalia.png   # NOCTALIA-SYNC
    color = rgba(10, 20, 14, 1.0)            # 图片加载前的底色
    blur_passes = 0                          # 0 = 完全不模糊
}

# ── 大时钟 ───────────────────────────────────────────────────
#    Segoe UI Semilight 102pt(=136px)；盒高 182，顶边距 54 → 墨迹中心距顶 153
#    时间格式 %-H:%M（不补前导零），对应 Windows 中文区的短时间格式
label {
    monitor =
    text = cmd[update:1000] date +%-H:%M
    font_family = Segoe UI Semilight
    font_size = 102
    color = rgba(255, 255, 255, 0.98)
    position = 0, -54
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ── 日期（时钟正下方，加粗）──────────────────────────────────
#    28pt(=37px)，盒高 55，顶边距 229 → 墨迹中心距顶 261
#    整行统一用 Noto Sans CJK SC Bold：数字和汉字字重一致，
#    最接近 Win11 的 Microsoft YaHei Semibold（本机未装 YaHei）
label {
    monitor =
    text = cmd[update:30000] LC_TIME=zh_CN.UTF-8 date "+%-m月%-d日, %A"
    font_family = Noto Sans CJK SC Bold
    font_size = 28
    color = rgba(255, 255, 255, 0.98)
    position = 0, -229
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ── 密码框：空输入时完全隐藏，敲键才浮现 ─────────────────────
#    fade_on_empty + fade_timeout=0 → 待机态看不到它；
#    认证失败时 hyprlock 会强制保持可见，所以错误提示不会被吞掉。
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 6                             # Win11 是小圆角，不是胶囊
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.60)
    inner_color = rgba(255, 255, 255, 0.16)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Segoe UI

    # 注意：Pango markup 不认 rgba()，必须 #RRGGBB + alpha
    placeholder_text = <span foreground="#FFFFFF" alpha="60%">密码</span>
    fail_text = <span foreground="#FFFFFF" alpha="95%">密码不正确。请重试。</span>
    fail_color = rgba(196, 43, 28, 0.85)
    check_color = rgba(255, 255, 255, 0.30)

    fade_on_empty = true
    fade_timeout = 0

    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

