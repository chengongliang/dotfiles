# General
background_opacity 0.5
font_size 12.0
confirm_os_window_close 0
enabled_layouts splits,*

# Cursor trail (disabled)
cursor_trail 200
cursor_trail_decay 0.05 0.4

# Keybindings
map alt+t new_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+w close_tab

# Vim-style split management
map alt+enter combine : goto_layout splits : launch --cwd=current --location=vsplit
map alt+shift+enter combine : goto_layout splits : launch --cwd=current --location=hsplit
map alt+q close_window

# Font
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Catppuccin Mocha
# 色值与 Ghostty 内置主题 /usr/share/ghostty/themes/Catppuccin Mocha 保持一致，
# 改动时请同步 alacritty/themes/catppuccin-mocha.toml 。
background            #1e1e2e
foreground            #cdd6f4
selection_background  #585b70
selection_foreground  #cdd6f4
cursor                #f5e0dc
cursor_text_color     #1e1e2e
url_color             #89b4fa

# Normal colors
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #a6adc8

# Bright colors
color8  #585b70
color9  #f37799
color10 #89d88b
color11 #ebd391
color12 #74a8fc
color13 #f2aede
color14 #6bd7ca
color15 #bac2de
